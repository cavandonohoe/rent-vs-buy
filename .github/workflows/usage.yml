name: shinyapps.io usage badge

# Daily snapshot of shinyapps.io active-hours usage (free tier = 25 hrs/mo).
# Writes a shields.io endpoint JSON and a usage-history CSV to the data-only
# `badges` branch, which the README badge reads. Opens a GitHub issue when
# usage crosses 80% of the cap. Uses the same SHINYAPPS_* secrets as deploy.

on:
  schedule:
    # 13:00 UTC daily (~6am PT). GitHub may delay scheduled runs under load.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: usage-badge
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::jsonlite

      # Seed badge/ with the existing history from the badges branch so the
      # CSV accumulates across runs instead of resetting each day.
      - name: Restore existing badge data
        run: |
          set -euo pipefail
          mkdir -p badge
          git fetch origin badges --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git show origin/badges:badge/usage-history.csv \
              > badge/usage-history.csv 2>/dev/null || true
          fi

      - name: Compute usage, badge JSON, and history
        id: usage
        run: Rscript scripts/usage_badge.R

      - name: Publish badge + history to badges branch
        run: |
          set -euo pipefail
          cp badge/usage.json /tmp/usage.json
          cp badge/usage-history.csv /tmp/usage-history.csv

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The data-only `badges` branch holds just the badge JSON + history
          # CSV, so the daily commits never touch main's history.
          git fetch origin badges --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badge
          cp /tmp/usage.json badge/usage.json
          cp /tmp/usage-history.csv badge/usage-history.csv

          git add badge/usage.json badge/usage-history.csv
          if git diff --cached --quiet; then
            echo "No change in usage data; skipping commit."
          else
            git commit -m "Update shinyapps.io usage badge + history [skip ci]"
            git push origin badges
          fi

      # Nudge: open (or update) a single issue when usage crosses 80% of the
      # cap. De-duplicated by a fixed marker so we don't spam a new issue daily.
      - name: Alert when over 80% of the cap
        if: ${{ fromJSON(steps.usage.outputs.pct) >= 80 }}
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ steps.usage.outputs.pct }}
          HOURS_USED: ${{ steps.usage.outputs.hours_used }}
          CAP: ${{ steps.usage.outputs.free_tier_hours }}
        run: |
          set -euo pipefail
          MARKER="<!-- shinyapps-usage-alert -->"
          TITLE="shinyapps.io usage at ${PCT}% of free-tier cap"
          BODY="${MARKER}
          Active-hours usage is at **${PCT}%** of the free-tier cap
          (${HOURS_USED} / ${CAP} active hours over the last 30 days).

          At 100% the app stops serving until the cycle resets. Consider
          lowering the instance idle timeout in the shinyapps.io dashboard,
          or upgrade the plan if this is expected.

          _Auto-generated by the usage-badge workflow; updated on each run
          while usage stays above 80%._"

          # Find an existing open alert issue by its hidden marker.
          EXISTING=$(gh issue list --state open --limit 100 \
            --json number,body \
            --jq "map(select(.body | contains(\"${MARKER}\")))
                  | .[0].number // empty")

          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --title "${TITLE}" --body "${BODY}"
            echo "Updated existing alert issue #${EXISTING}."
          else
            gh issue create --title "${TITLE}" --body "${BODY}" \
              --assignee "${{ github.repository_owner }}"
            echo "Opened new alert issue."
          fi
