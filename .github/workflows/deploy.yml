name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - app.R
      - R/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      # Persist the user library across steps so install.packages in one
      # step is visible to Rscript in the next step. Without this, each
      # `run:` is a fresh shell with no R_LIBS_USER set, and packages
      # installed in step N aren't found in step N+1.
      R_LIBS_USER: ${{ github.workspace }}/R-libs
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Create user library
        run: mkdir -p "$R_LIBS_USER"

      # We deliberately do NOT use setup-r-dependencies / pak / RSPM here.
      # rsconnect's manifest snapshot records the Repository field from the
      # installed packages' DESCRIPTION metadata. pak/RSPM writes
      # "Repository: RSPM" and shinyapps.io's image builder rejects that
      # source URL scheme. install.packages() from CRAN writes
      # "Repository: CRAN", which the build server accepts.
      - name: Install runtime packages from CRAN
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            install.packages(c(
              "rsconnect", "shiny", "bslib", "shinyWidgets",
              "ggplot2", "scales", "jsonlite"
            ))
          '

      - name: Configure rsconnect
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          '

      - name: Deploy
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            rsconnect::deployApp(
              appDir = ".",
              appName = "rent-vs-buy",
              account = Sys.getenv("SHINYAPPS_NAME"),
              server = "shinyapps.io",
              forceUpdate = TRUE
            )
          '
