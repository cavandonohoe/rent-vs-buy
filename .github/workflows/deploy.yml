name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - app.R
      - R/**
      - .rscignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      # Note: do NOT use the `any::` prefix on packages here. With
      # `any::pkg`, pak writes "Source: any" and "Repository: CRAN" (the
      # literal string "CRAN", not a URL) into the package DESCRIPTION.
      # rsconnect then emits a manifest where shinyapps.io's image
      # builder treats "CRAN" as a URL scheme and fails with:
      #   Unsupported url scheme: CRAN/src/contrib/<pkg>.tar.gz
      # Plain bare names (or `cran::pkg`) cause pak to write
      # "Source: CRAN" + "Repository: https://...". (See PR #16 for the
      # manifest dump that revealed this asymmetry.)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rsconnect
            shiny
            bslib
            shinyWidgets
            ggplot2
            scales
            jsonlite
            cpp11
            isoband

      # setup-r-dependencies still writes "Repository: RSPM" for the
      # bare-name packages. Rewrite RSPM -> the actual CRAN URL so the
      # manifest source URLs resolve correctly on shinyapps.io.
      - name: Rewrite RSPM -> CRAN URL in installed DESCRIPTION files
        run: |
          Rscript -e '
            libs <- .libPaths()
            for (lib in libs) {
              desc_files <- list.files(
                lib, pattern = "^DESCRIPTION$",
                recursive = TRUE, full.names = TRUE
              )
              for (f in desc_files) {
                txt <- readLines(f, warn = FALSE)
                new <- sub("^Repository:[[:space:]]*RSPM[[:space:]]*$",
                           "Repository: CRAN", txt)
                if (!identical(txt, new)) {
                  writeLines(new, f)
                }
              }
            }
            cat("done rewriting DESCRIPTION files\n")
          '

      - name: Configure rsconnect
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          '

      - name: Deploy
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            rsconnect::deployApp(
              appDir = ".",
              appName = "rent-vs-buy",
              account = Sys.getenv("SHINYAPPS_NAME"),
              server = "shinyapps.io",
              forceUpdate = TRUE
            )
          '
