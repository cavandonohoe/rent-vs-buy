name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - app.R
      - R/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      # shinyapps.io's image builder only fetches package sources from
      # CRAN-style URLs. Force renv (used by rsconnect to capture the
      # manifest) to record Source: CRAN regardless of where pak/RSPM
      # actually installed the binaries on this runner. Without this,
      # rsconnect emits Source: RSPM and the server-side build fails with
      # "Unsupported url scheme: RSPM/src/contrib/<pkg>.tar.gz".
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::bslib
            any::shinyWidgets
            any::ggplot2
            any::scales
            any::jsonlite
            any::cpp11
            any::isoband

      - name: Configure rsconnect
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          '

      - name: Deploy
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            rsconnect::deployApp(
              appDir = ".",
              appName = "rent-vs-buy",
              account = Sys.getenv("SHINYAPPS_NAME"),
              server = "shinyapps.io",
              forceUpdate = TRUE
            )
          '
