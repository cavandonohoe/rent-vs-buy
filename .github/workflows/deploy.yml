name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - app.R
      - R/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::bslib
            any::shinyWidgets
            any::ggplot2
            any::scales
            any::jsonlite
            any::cpp11
            any::isoband

      # setup-r-dependencies installs binaries from Posit Package Manager
      # (RSPM), which is fast and handles system libs, but writes
      # "Repository: RSPM" into every package's DESCRIPTION file. When
      # rsconnect builds the deploy manifest it reads that field, and
      # shinyapps.io's image builder rejects the manifest with
      # "Unsupported url scheme: RSPM/src/contrib/<pkg>.tar.gz".
      #
      # Rewrite Repository: RSPM -> Repository: CRAN in every installed
      # package's DESCRIPTION before deploy. The CRAN binary is identical
      # to the RSPM binary for these packages, so this is a metadata-only
      # fix.
      - name: Rewrite RSPM -> CRAN in installed DESCRIPTION files
        run: |
          Rscript -e '
            libs <- .libPaths()
            for (lib in libs) {
              desc_files <- list.files(
                lib, pattern = "^DESCRIPTION$",
                recursive = TRUE, full.names = TRUE
              )
              for (f in desc_files) {
                txt <- readLines(f, warn = FALSE)
                new <- sub("^Repository:[[:space:]]*RSPM[[:space:]]*$",
                           "Repository: CRAN", txt)
                if (!identical(txt, new)) {
                  writeLines(new, f)
                }
              }
            }
            cat("done rewriting DESCRIPTION files\n")
          '

      - name: Configure rsconnect
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
          '

      - name: Deploy
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            rsconnect::deployApp(
              appDir = ".",
              appName = "rent-vs-buy",
              account = Sys.getenv("SHINYAPPS_NAME"),
              server = "shinyapps.io",
              forceUpdate = TRUE
            )
          '
